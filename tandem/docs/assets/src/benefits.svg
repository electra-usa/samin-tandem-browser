<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="682" viewBox="0 0 1120 682"><defs><style>text{font-family:Arial,sans-serif;fill:#14202b}.muted{fill:#5f6b78}.accent{fill:#2f80d6}</style><filter id="shadow" width="140%" height="150%" x="-20%" y="-20%"><feDropShadow dx="0" dy="6" flood-color="#14202B" flood-opacity=".07" stdDeviation="10"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4"><path fill="none" stroke="#8C9BAA" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M1 1 6 4 1 7"/></marker></defs><rect width="1120" height="682" fill="#F7FAFD" rx="26"/><rect width="1118.5" height="680.5" x=".75" y=".75" fill="none" stroke="#DCE6F0" stroke-width="1.5" rx="25.25"/><text x="44" y="51" class="accent" font-size="12" font-weight="700" letter-spacing="1.8">MADE TO SHARE THE WHEEL</text><text x="44" y="104" font-size="36" font-weight="500" letter-spacing="-1">Your browser, with room for both of you.</text><rect width="332" height="229" x="44" y="143" fill="#FFF" stroke="#DCE6F0" rx="15"/><rect width="43" height="43" x="66" y="165" fill="#E7E2FA" rx="11"/><g fill="none" stroke="#6D5BD0" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" transform="translate(75.5 174.5) scale(1)"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></g><text x="66" y="251" font-size="20" font-weight="600" letter-spacing="-.35">Always on</text><text x="66" y="284" class="muted" font-size="17">Runs on your VPS, even when</text><text x="66" y="310" class="muted" font-size="17">your laptop is closed.</text><rect width="332" height="229" x="394" y="143" fill="#FFF" stroke="#DCE6F0" rx="15"/><rect width="43" height="43" x="416" y="165" fill="#DCEEFF" rx="11"/><g fill="none" stroke="#2F80D6" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" transform="translate(425.5 174.5) scale(1)"><rect width="15" height="12" x="2" y="3" rx="2"/><path d="M6 19h4m-2-4v4M4 6h11"/><rect width="5" height="11" x="17" y="10" rx="1.5"/></g><text x="416" y="251" font-size="20" font-weight="600" letter-spacing="-.35">Same tabs, anywhere</text><text x="416" y="284" class="muted" font-size="17">Open the same session from</text><text x="416" y="310" class="muted" font-size="17">any computer.</text><rect width="332" height="229" x="744" y="143" fill="#FFF" stroke="#DCE6F0" rx="15"/><rect width="43" height="43" x="766" y="165" fill="#DCEEFF" rx="11"/><g fill="none" stroke="#2F80D6" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65"><path d="m5 3 14 11-7 1-3 6z" transform="translate(775.5 174.5) scale(1)"/><path d="m14 16 3 5M17 3v3m3 1h-3" transform="translate(775.5 174.5) scale(1)"/></g><text x="766" y="251" font-size="20" font-weight="600" letter-spacing="-.35">Take the wheel anytime</text><text x="766" y="284" class="muted" font-size="17">Click, type and scroll. Your agent</text><text x="766" y="310" class="muted" font-size="17">waits until you hand back.</text><rect width="332" height="229" x="44" y="392" fill="#FFF" stroke="#DCE6F0" rx="15"/><rect width="43" height="43" x="66" y="414" fill="#DCEEFF" rx="11"/><g fill="none" stroke="#2F80D6" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" transform="translate(75.5 423.5) scale(1)"><rect width="14" height="11" x="5" y="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></g><text x="66" y="500" font-size="20" font-weight="600" letter-spacing="-.35">Locked down</text><text x="66" y="533" class="muted" font-size="17">Login + 2FA. Nothing else</text><text x="66" y="559" class="muted" font-size="17">exposed to the internet.</text><rect width="332" height="229" x="394" y="392" fill="#FFF" stroke="#DCE6F0" rx="15"/><rect width="43" height="43" x="416" y="414" fill="#E7E2FA" rx="11"/><g fill="none" stroke="#6D5BD0" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65"><path d="m7 5-5 7 5 7m10-14 5 7-5 7m-3-16-4 20" transform="translate(425.5 423.5) scale(1)"/></g><text x="416" y="500" font-size="20" font-weight="600" letter-spacing="-.35">Works with any MCP agent</text><text x="416" y="533" class="muted" font-size="17">Bring Hermes, Claude Code,</text><text x="416" y="559" class="muted" font-size="17">Codex or your MCP client.</text><rect width="332" height="229" x="744" y="392" fill="#FFF" stroke="#DCE6F0" rx="15"/><rect width="43" height="43" x="766" y="414" fill="#DCEEFF" rx="11"/><g fill="none" stroke="#2F80D6" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65"><path d="M20 9a8 8 0 0 0-14-3L3 9m0-5v5h5M4 15a8 8 0 0 0 14 3l3-3m0 5v-5h-5" transform="translate(775.5 423.5) scale(1)"/></g><text x="766" y="500" font-size="20" font-weight="600" letter-spacing="-.35">Stays current</text><text x="766" y="533" class="muted" font-size="17">Follows upstream updates,</text><text x="766" y="559" class="muted" font-size="17">with checks before they land.</text></svg>